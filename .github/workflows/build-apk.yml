name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        pip install "briefcase==0.3.23" "briefcase-p4a-backend==1.0.0"
    - name: Build APK
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        briefcase create android p4a
        briefcase build android p4a
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-apk
        path: android/**/*.apk
