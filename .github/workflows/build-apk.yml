name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build APK with Docker
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/home/user/hostcwd \
          -v ~/.buildozer:/home/user/.buildozer \
          kivy/buildozer:latest \
          bash -c "yes | sdkmanager --licenses && buildozer android debug"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-apk
        path: bin/*.apk
